<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mohammed's Quiz App</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Mohammed's Quiz App</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/pages/auth/login.html">Login</a>
            <a href="/pages/auth/register.html">Register</a>
        </nav>
    </header>
    
    <main>
        <section class="auth-form">
            <h2>Register</h2>
            <form id="registerForm" action="/api/auth/register" method="POST">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="role">Role:</label>
                    <select id="role" name="role" required>
                        <option value="player">Player</option>
                        <option value="admin">Admin (Teacher)</option>
                    </select>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p class="auth-link">Already have an account? <a href="/pages/auth/login.html">Login here</a></p>
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 Mohammed's Quiz App</p>
    </footer>
    
    <script src="/js/auth.js"></script>
</body>
</html>
